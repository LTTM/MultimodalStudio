---

method: multiscene_dictionary_fields_raw_model_radiance_latent

n_gpu: 1
mixed_precision: False
matmul_precision: high
max_num_iterations: 1000000
steps_per_save: 100000

pipeline:
  steps_per_scene: 15
  evaluator:
    steps_per_eval_batch: 2000
    steps_per_eval_image: 50000
    steps_per_eval_all_scenes: 1000000
    steps_per_export_mesh: 1000000
    steps_per_export_poses: 200000
    scene_to_eval_indexes: [1, 5, 9, 16, 28]
    eval_num_rays_per_chunk: 4096
    rendering_scale: 0.25
    export_mesh: True
    mesh_extractor:
      gt_scale: False
    export_poses: True
    pose_extractor:
      gt_scale: False
    export_aligned_renderings: False
    export_demosaicked_renderings: False
    extra_modalities_to_exclude:
      - radiance_hadamard_latent
      - radiance_projection_latent

  datamanager:
    modalities:
      - rgb
      - infrared
      - mono
      - polarization
      - multispectral

    mode: 'pre-training'
    eval_scene_indices: [2, 4, 11, 23, 26]
    eval_image_indices: [9, 19, 29, 39, 49]
  
    pixel_sampler:
      num_rays_per_modality: 2048
  
    camera_optimizer:
      mode: 'SO3xR3'
      shared_optimization: True
      rig: False
      relative_pose_opt: True
      reference_modality: rgb
      modalities_to_optimize:
        rgb: True
        infrared: True
        mono: True
        polarization: True
        multispectral: True
  
  model:
    ray_sampler:
      num_samples: 32
      num_samples_importance: 32
  
    background_ray_sampler:
      num_samples: 16
  
    surface_model:
      use_numerical_gradients: True
      numerical_gradient_taps: 4
      surface_field:
        field:
          module:
            feature_grid:
              encoding:
                max_res: 1024
              coarse_to_fine: True
              radius: 1.0
            mlp_head:
              hidden_dim: 256
              geometric_init: True
              weight_norm: True
              geometric_init_bias: 0.4
        use_position_encoding: True
      compute_hessian: True
  
    radiance_model:
      radiance_field:
        basis_field:
          base_field:
            encoding:
              features_per_level: [16, 16, 16, 8, 8, 8]
              resolutions: [32, 51, 70, 89, 108, 128]
            coarse_to_fine: True
        coefficient_field:
          module:
            base_field:
              encoding:
                features_per_level: [72]
                resolutions: [16]
            init_strategy: 'value'
            init_value: 0.05
        projection_function:
          input_dropout: True
          out_activation: "Tanh"
        radiance_predictor:
          out_activation: "Tanh"
      use_n_dot_v: True
      use_reflection_direction: False
      radiance_latent_dim: 16
      use_latent_dropout: False
      dropout_probability: 0.25
      output_latent: True

    use_background_model: True
    background_model:
      background_field:
        module:
          base_field:
            weight_norm: True
            output_dim: 256
          head_field:
            hidden_dim: 256
            weight_norm: True

    renderer:
      background_color: None

    estimate_latents: True
    latent_estimators:
      radiance_latent_estimator:
        field:
          out_activation: "Tanh"
    use_many2one_modality_estimator: True
    use_many2luma_estimator: True
    use_random_many2one_modality: True
    many2one_modality_to_estimate: rgb
    detach_many2one_modalities: True
    geo_feature_modality: random
      
  loss_manager:
    additional_losses:
      latent_consistency_loss:
        enabled: True
      latent_regularization_loss:
        weight: 0.1
        enabled: False
      many2luma_modality_consistency_loss:
        enabled: True

  optimizers:
    background_field:
      optimizer:
        lr: 0.0002

logging:
  steps_per_log: 100
  steps_per_flush_buffer: 100

...
